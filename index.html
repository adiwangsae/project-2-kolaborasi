<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #e0f2fe);
            color: #172033;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #5366d6;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #5366d6;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            text-align: center;
            gap: 8px;
        }

        .stats div {
            background: #f2f4ff;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            color: #5366d6;
        }

        .stats strong {
            display: block;
            font-size: 22px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        li.done span {
            text-decoration: line-through;
            color: #aaa;
        }

        li input {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
        }

        .delete-btn {
            background: #ffe8eb;
            color: #d33;
        }

        #empty {
            text-align: center;
            color: #999;
            padding: 15px;
        }

        @media (max-width: 450px) {
            .input-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DailyTask 📋</h1>

        <p class="description">
            Kelola aktivitas harianmu dengan lebih mudah.
        </p>

        <div class="input-area">

            <input type="text" id="taskInput" placeholder="Tulis kegiatan baru..." maxlength="120">

            <button class="add-btn" onclick="addTask()">
                Tambahkan
            </button>

        </div>

        <div class="stats">

            <div>
                <strong id="total">0</strong>
                Semua
            </div>

            <div>
                <strong id="completed">0</strong>
                Tuntas
            </div>

            <div>
                <strong id="remaining">0</strong>
                Proses
            </div>

        </div>

        <h3>Daftar Aktivitas</h3>

        <ul id="taskList"></ul>

        <p id="empty">
            Belum ada aktivitas yang ditambahkan.
        </p>

    </div>

</body>

</html>
